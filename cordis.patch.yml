# Self-contained drop-in: this bundle registers the enhanced web tools AND
# disables the stock `tool-web` row in one install. The last entry is a
# top-level id-targeted row (not an `insert`), so the loader merges it onto
# the existing `tool-web` entry and tears it down — installing this package is
# the whole swap for CLI profiles; preset-realm Web surfaces still disable
# their own `tool-web` row.
- insert:
    - id: tool-web-enhanced
      name: dsh-tool-web-enhanced
      config:
        search: true
        fetch: true
        sections:
          searxng:
            enabled: true
            url: http://127.0.0.1:8080
          rag:
            enabled: true
            storePath: ''
            embeddings:
              provider: auto
              apiKeyEnv: EMBEDDING_API_KEY
              apiKey: ''
              model: BAAI/bge-m3
              baseURL: https://api.deepinfra.com/v1/openai
              localModel: Xenova/bge-small-en-v1.5
            databases: []

- id: tool-web
  disabled: true
